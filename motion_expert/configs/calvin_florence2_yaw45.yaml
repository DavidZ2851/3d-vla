# Robot-base yaw45 motion expert (arm D of the frame-consistency experiment).
#
# Byte-for-byte identical to calvin_florence2.yaml except for four things:
#   1. data.camera_frame: calvin_base_yaw45  -- online R+t at load time
#   2. train.normalization_stats_path     -- frame-specific (see below)
#   3. train.output_dir / wandb.name      -- separate run
#   4. normalization_use_percentile_from_zarr: true
# Everything else MUST stay in lockstep with the world config, otherwise the
# world-vs-camera comparison stops isolating the frame.
#
# On (2): per-axis scale is frame-dependent. This frame is a pure 45 deg yaw
# about world z, so the z axis is untouched and only x/y are remixed -- a
# different perturbation from the camera arm, which tilts z by 59 deg and
# breaks gravity alignment. Reusing another frame's JSON mis-scales the axes;
# train.py raises instead of letting that pass.
#
# On (4): the world stats were estimated from the raw NPZs, which cannot
# express a frame transform (and whose source_root no longer exists). The
# zarr-sourced percentile estimator uses the SAME center/scale definition
# (center=(p005+p995)/2, scale=(p995-p005)/2), so both arms remain comparable.

model:
  backbone_type: florence2
  grid_size: 20
  future_steps: 15
  decoder_type: sparse_factorized
  knn_k: 16
  flow_timesteps: 100
  use_motion_weighted_loss: true
  motion_weight_tau: 0.005
  motion_weight_temp: 5.0
  motion_weight_gamma: 1.0
  motion_weight_static_floor: 0.05
  input_height: 224
  input_width: 224
  text_max_length: 16
  image_pad_value: 0.5
  query_uv_format: source_pixels
  dropout: 0.1
  use_calvin_percentile_normalization: true
  sparse_decoder:
    hidden_dim: 512
    point_encoder_layers: 6
    decoder_layers: 8
    num_attention_heads: 16
    mlp_ratio: 4
    decoder_spatial_attention: serialized_flash
    decoder_serialized_patch_size: 32
    decoder_serialized_orders: [z, z-trans]
    decoder_serialized_depth: 16
    decoder_serialized_shift_windows: true
  florence:
    model_name_or_path: microsoft/Florence-2-large
    freeze_backbone: true
    gradient_checkpointing: false
    lora_rank: 0

train:
  output_dir: /data/user_data/ziyinx/analogical_manipulation_clean/train_logs/motion_expert/calvin_florence2_yaw45
  device: cuda
  batch_size: 32
  num_workers: 4
  pin_memory: true
  lr: 1.0e-4
  lr_scheduler: cosine_with_warmup
  lr_warmup_steps: 1000
  min_lr: 1.0e-5
  weight_decay: 5.0e-3
  clip_grad_norm: 1.0
  mixed_precision: true
  train_iters: 20000
  train_log_every: 100
  train_eval_every: 1000
  train_eval_loss_batches: 200
  train_eval_generation_batches: 2
  save_every_iters: 2000
  val_every_iters: 2000
  val_loss_batches: 200
  val_num_inference_steps: 10
  val_generation_batches: 8
  guidance_scale: 1.0
  use_calvin_normalization: true
  normalization_stats_path: /data/user_data/ziyinx/analogical_manipulation_clean/datasets/calvin_motion_normalization_stats_yaw45.json
  normalization_use_percentile_from_zarr: true
  # Estimated over the full 727,036 rows, matching how the world baseline's
  # NPZ stats were computed -- so the two arms differ only in frame, not in
  # how much data the percentiles saw. Precomputed via the CLI (~40 min CPU):
  #   python -m motion_expert.compute_calvin_normalization_stats \
  #     --zarr <train_rechunked8.zarr> --camera-frame calvin_base_yaw45 \
  #     --output-json <normalization_stats_path>
  # If the file is absent, training regenerates it on rank 0 before the loop.
  normalization_chunk_size: 512
  wandb:
    enabled: true
    project: 3d-vla
    name: motion-florence2-calvin-yaw45
    mode: online
    tags:
      - calvin
      - motion_expert
      - florence2
      - yaw45_frame

data:
  train_zarr: /data/group_data/katefgroup-ssd/world_model/ziyinx/calvin_motion_zarr/train_rechunked8.zarr
  val_zarr: /data/group_data/katefgroup-ssd/world_model/ziyinx/calvin_motion_zarr/val_rechunked8.zarr
  instructions_path: /data/user_data/ziyinx/analogical_manipulation_clean/instructions/calvin/train_motion_instructions_full.json
  train_instructions_path: /data/user_data/ziyinx/analogical_manipulation_clean/instructions/calvin/train_motion_instructions_full.json
  val_instructions_path: /data/user_data/ziyinx/analogical_manipulation_clean/instructions/calvin/val_motion_instructions_full.json
  instruction_id_key: instr_id
  mem_limit_gb: 16.0
  traj_3d_xyz_is_delta: true
  chunk_size: 8
  # The only data-side change: one constant world -> yaw45 rigid transform,
  # applied online at load. Same zarr as every other arm, nothing is forked.
  camera_frame: calvin_base_yaw45
