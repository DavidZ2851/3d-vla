model:
  backbone_type: florence2
  grid_size: 20            # 20x20 = 400 query points
  future_steps: 15
  decoder_type: sparse_factorized
  knn_k: 16
  flow_timesteps: 100
  use_motion_weighted_loss: true
  motion_weight_tau: 0.005
  motion_weight_temp: 5.0
  motion_weight_gamma: 1.0
  motion_weight_static_floor: 0.05
  input_height: 224
  input_width: 224
  text_max_length: 16
  image_pad_value: 0.5
  query_uv_format: source_pixels
  dropout: 0.1
  use_calvin_percentile_normalization: false   # UVD uses its own scheme
  # Per-axis target-delta scale [du(grid), dv(grid), dd(metres)] from
  # compute_calvin_uvd_norm_stats.py. Comment out to auto-estimate from data std.
  traj_delta_uvd_scale: [0.057555, 0.050481, 0.068054]
  sparse_decoder:
    hidden_dim: 256
    point_encoder_layers: 4
    decoder_layers: 6
    num_attention_heads: 8
    mlp_ratio: 4
    visual_global_tokens: 16
    decoder_spatial_attention: knn             # UVD uses KNN over (u,v,d)
  florence:
    model_name_or_path: microsoft/Florence-2-large
    freeze_backbone: true
    gradient_checkpointing: false
    lora_rank: 0

train:
  output_dir: /data/user_data/ziyinx/analogical_manipulation_clean/train_logs/motion_expert/calvin_florence2_uvd
  device: cuda
  batch_size: 32
  num_workers: 4
  pin_memory: true
  lr: 1.0e-4
  min_lr: 1.0e-5
  lr_warmup_steps: 1000
  weight_decay: 5.0e-3
  clip_grad_norm: 1.0
  train_iters: 20000
  train_log_every: 100
  val_every_iters: 2000
  val_loss_batches: 100
  save_every_iters: 2000
  wandb:
    enabled: true
    project: 3d-vla
    name: motion-florence2-uvd-calvin
    mode: online
    tags:
      - calvin
      - motion_expert
      - florence2
      - uvd

data:
  train_zarr: /data/user_data/ziyinx/datasets/zarr_datasets/calvin_motion_uvd_zarr/train_rechunked8.zarr
  val_zarr: /data/user_data/ziyinx/datasets/zarr_datasets/calvin_motion_uvd_zarr/val_rechunked8.zarr
  instructions_path: /data/user_data/ziyinx/analogical_manipulation_clean/instructions/calvin/train_instructions.json
  train_instructions_path: /data/user_data/ziyinx/analogical_manipulation_clean/instructions/calvin/train_instructions.json
  val_instructions_path: /data/user_data/ziyinx/analogical_manipulation_clean/instructions/calvin/train_instructions.json
  # Query-depth global standardization (metres) from compute_calvin_uvd_norm_stats.py.
  query_depth_mean: 4.290679
  query_depth_std: 0.542424
